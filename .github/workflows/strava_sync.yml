name: Strava Activity Sync

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Tage zurück'
        required: false
        default: '7'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary python-dotenv

      - name: Run Strava Sync
        env:
          STRAVA_CLIENT_ID:      ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET:  ${{ secrets.STRAVA_CLIENT_SECRET }}
          RAILWAY_DATABASE_URL:  ${{ secrets.RAILWAY_DATABASE_URL }}
          CYCLING_FTP_W:         "191"
          STRAVA_SYNC_DAYS_BACK: ${{ inputs.days_back || '7' }}
        run: python data/strava_sync.py
