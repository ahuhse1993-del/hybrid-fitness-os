name: Generate Training Plan

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'plan_jobs.id für den zu generierenden Plan'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary anthropic requests python-dotenv pytz

      - name: Generate Plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python data/generate_plan.py "${{ inputs.job_id }}"
