name: Hevy CAIRN Routines Sync

on:
  schedule:
    # Alle 2 Tage um 04:00 UTC
    - cron: '0 4 */2 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary python-dotenv

      - name: Sync CAIRN Routines
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python data/hevy_routines_sync.py
