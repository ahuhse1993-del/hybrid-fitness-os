/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: light-dark(#f5f4ef, #151b18);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
.view { display: none; }
.view.active {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}
/* Shell füllt die View aus und scrollt intern */
.view .shell {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  width: 100%;
}
/* Scrollbarer Inhaltsbereich pro View */
#week-body, #plan-body, #sync-body, #analysis-body, #acts-body {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

/* ── SHARED COMPONENTS ── */
.card {
  min-width: 0;
  padding: 14px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: 1.2rem;
  background: var(--card, var(--soft));
}
small, .text-small { font-size: .8rem; line-height: 1.5; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.btn, .form-select {
  font: inherit;
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 10px;
  min-height: 32px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  text-decoration: none;
}
.btn svg { width: 16px; height: 16px; pointer-events: none; flex-shrink: 0; }
.form-select {
  display: block;
  width: 100%;
  padding: .55rem .9rem;
  border-radius: .75rem;
  border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  background: transparent;
  font-size: inherit;
}
.form-label { display: block; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; margin-bottom: .35rem; opacity: .7; }
.loading-msg { padding: 2rem 1rem; text-align: center; opacity: .5; }
.skeleton { background: color-mix(in srgb, currentColor 10%, transparent); border-radius: .5rem; }

/* ── WEEK VIEW ── */
#cairn-week-soft {
  color-scheme: light dark;
  --paper: light-dark(#f5f4ef, #151b18);
  --ink: light-dark(#17201d, #f5f4ef);
  --forest: light-dark(#29483e, #b8ddcf);
  --forest-ink: light-dark(#f8f7f1, #173028);
  --coral: light-dark(#ff6b61, #b84d47);
  --coral-ink: light-dark(#18211e, #fff5f3);
  --soft: light-dark(#e9e8e2, #29302d);
  --sand: light-dark(#d8d4c8, #4f4b43);
  --line: light-dark(#b9bbb4, #53605b);
  --muted-foreground: light-dark(rgb(23 32 29 / 50%), rgb(245 244 239 / 50%));
  background: var(--paper);
  color: var(--ink);
  padding: clamp(.75rem, 3vw, 1.5rem);
}
#cairn-week-soft * { box-sizing: border-box; }
#cairn-week-soft .shell { max-width: 820px; margin: 0 auto; }
#cairn-week-soft header { flex-shrink: 0; margin-bottom: .5rem; }
#cairn-week-soft .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; }
#cairn-week-soft .brand-mark { display: block; width: clamp(8.5rem, 26vw, 12rem); height: auto; fill: currentColor; }
#cairn-week-soft .week-switcher { display: flex; align-items: center; gap: .8rem; margin-bottom: 1rem; padding-bottom: .65rem; border-bottom: 1px solid var(--line); }
#cairn-week-soft .week-title h1 { margin: 0; letter-spacing: -.05em; font-weight: 500; }
#cairn-week-soft .week-title p { margin: .1rem 0 0; color: var(--muted-foreground); }
#cairn-week-soft .week-list { display: grid; gap: .55rem; }
#cairn-week-soft .week-divider { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 1.4rem 0 .65rem; padding-top: 1rem; border-top: 1px solid var(--line); }
#cairn-week-soft .week-divider h2 { margin: 0; font-weight: 500; letter-spacing: -.04em; }
#cairn-week-soft .week-divider p { margin: 0; color: var(--muted-foreground); }
#cairn-week-soft .week-card { position: relative; min-height: 88px; display: flex; align-items: center; gap: 0; overflow: hidden; color: var(--ink); }
#cairn-week-soft .week-card.is-dark { --card: var(--forest); color: var(--forest-ink); }
#cairn-week-soft .week-card.is-coral { --card: var(--coral); color: var(--coral-ink); }
#cairn-week-soft .week-card.is-sand { --card: var(--sand); color: var(--ink); }
#cairn-week-soft .week-card.is-soft { --card: var(--soft); color: var(--ink); }
#cairn-week-soft .week-card.is-past { --card: color-mix(in srgb, var(--soft) 72%, var(--paper)); color: color-mix(in srgb, var(--ink) 56%, var(--paper)); }

#cairn-activities-soft .metric-row span + span::before { content: "·"; margin-right: .45rem; }
#cairn-activities-soft .activity-meta { margin: .5rem 0 0; text-transform: uppercase; letter-spacing: .03em; }
#cairn-activities-soft .card-side { flex: 0 0 52px; align-self: stretch; display: flex; align-items: center; justify-content: center; padding: .5rem .25rem; }

/* ── ANALYSIS VIEW ── */
#cairn-soft {
  color-scheme: light dark;
  --paper: light-dark(#f5f4ef, #151b18);
  --ink: light-dark(#17201d, #f5f4ef);
  --green: light-dark(#29483e, #b8ddcf);
  --green-ink: light-dark(#f8f7f1, #173028);
  --coral: light-dark(#ff6b61, #b84d47);
  --coral-ink: light-dark(#18211e, #fff5f3);
  --soft: light-dark(#e9e8e2, #29302d);
  --sand: light-dark(#d8d4c8, #4f4b43);
  --line: light-dark(#b9bbb4, #53605b);
  --muted-foreground: light-dark(rgb(23 32 29 / 50%), rgb(245 244 239 / 50%));
  background: var(--paper);
  color: var(--ink);
  padding: clamp(.8rem, 3vw, 1.8rem);
}
#cairn-soft * { box-sizing: border-box; }
#cairn-soft .shell { max-width: 820px; margin: 0 auto; }
#cairn-soft .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; }
#cairn-soft .brand-mark { display: block; width: clamp(8.5rem,26vw,12rem); height: auto; fill: currentColor; }
#cairn-soft .circle { width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: 50%; background: var(--soft); flex-shrink: 0; }
#cairn-soft .crumb { margin: 0 0 .5rem; color: var(--muted-foreground); cursor: pointer; }
#cairn-soft .crumb:hover { color: var(--ink); }
#cairn-soft h1 { margin: 0; font-size: clamp(2.6rem,9vw,4.8rem); line-height: .94; letter-spacing: -.065em; font-weight: 500; }
#cairn-soft h2, #cairn-soft h3 { font-weight: 500; }
#cairn-soft .heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
#cairn-soft .pill { border-radius: 999px; padding: .55rem .9rem; background: var(--green); color: var(--green-ink); white-space: nowrap; }
#cairn-soft .panel { margin-top: 1rem; }
#cairn-soft .green-card { --card: var(--green); color: var(--green-ink); }
#cairn-soft .coral-card { --card: var(--coral); color: var(--coral-ink); }
#cairn-soft .soft-card { --card: var(--soft); color: var(--ink); }
#cairn-soft .sand-card { --card: var(--sand); color: var(--ink); }
#cairn-soft .eyebrow { margin: 0 0 .5rem; text-transform: uppercase; letter-spacing: .05em; }
#cairn-soft .hero { display: grid; grid-template-columns: 1.2fr .85fr; gap: 1rem; }
#cairn-soft .hero-name { margin: 0 0 .35rem; font-size: clamp(2.2rem,7vw,3.8rem); line-height: .95; letter-spacing: -.055em; }
#cairn-soft .date { margin: 0 0 1.4rem; }
#cairn-soft .metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: .8rem; }
#cairn-soft .metric { padding-top: .65rem; border-top: 1px solid currentColor; }
#cairn-soft .metric span, #cairn-soft .metric strong { display: block; }
#cairn-soft .metric strong { font-size: clamp(1.25rem,4vw,1.9rem); font-weight: 500; letter-spacing: -.035em; }
#cairn-soft .map { min-height: 270px; border-radius: 1.4rem; background: var(--paper); color: var(--green); padding: 1rem; display: grid; place-items: center; }
#cairn-soft .map svg { width: 100%; max-width: 260px; height: auto; }
#cairn-soft .map-grid { stroke: var(--line); stroke-width: 1; }
#cairn-soft .route { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
#cairn-soft .route-start { fill: var(--coral); stroke: currentColor; stroke-width: 3; }
#cairn-soft .head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: .8rem; }
#cairn-soft .head h2, #cairn-soft .head p { margin: 0; }
#cairn-soft .analysis-title { margin: .2rem 0 .7rem; font-size: clamp(2rem,6vw,3.35rem); line-height: 1; letter-spacing: -.05em; }
#cairn-soft .analysis-copy { margin: 0; max-width: 650px; }
#cairn-soft .signals { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1rem; margin-top: 1.3rem; padding-top: 1rem; border-top: 1px solid currentColor; }
#cairn-soft .signals strong, #cairn-soft .signals span { display: block; }
#cairn-soft .signals strong { font-weight: 500; }
#cairn-soft .chart { display: block; width: 100%; height: auto; }
#cairn-soft .grid { stroke: var(--line); stroke-width: 1; }
#cairn-soft .axis { fill: currentColor; opacity: .66; }
#cairn-soft .elev-fill { fill: color-mix(in srgb, var(--green) 45%, transparent); }
#cairn-soft .elev-line { fill: none; stroke: var(--green); stroke-width: 3; }
#cairn-soft .pace-bar { fill: var(--green); }
#cairn-soft .pace-bar.hot { fill: var(--coral); }
#cairn-soft .hr-fill { fill: color-mix(in srgb, var(--coral) 60%, transparent); }
#cairn-soft .hr-line { fill: none; stroke: var(--coral); stroke-width: 2; }
#cairn-soft .avg { stroke: currentColor; stroke-dasharray: 5 5; stroke-width: 1.5; opacity: .7; }
#cairn-soft .trail-stats { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; background: var(--line); margin-top: .7rem; }
#cairn-soft .trail-stat { background: var(--soft); color: var(--ink); padding: .9rem; }
#cairn-soft .trail-stat span, #cairn-soft .trail-stat strong { display: block; }
#cairn-soft .trail-stat strong { font-size: 1.35rem; font-weight: 500; }
#cairn-soft .zone-row { display: grid; grid-template-columns: 50px minmax(0,1fr) 64px; align-items: center; gap: .8rem; margin: .65rem 0; }
#cairn-soft .zone-track { height: 1.05rem; border-radius: 999px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
#cairn-soft .zone-fill { height: 100%; width: var(--w); border-radius: inherit; background: var(--green); }
#cairn-soft .zone-row:nth-child(4) .zone-fill, #cairn-soft .zone-row:nth-child(5) .zone-fill, #cairn-soft .zone-row:nth-child(6) .zone-fill { background: var(--coral); }
#cairn-soft .gear-row { display: flex; align-items: end; justify-content: space-between; gap: 1rem; }
#cairn-soft .gear-row h3, #cairn-soft .gear-row p { margin: .15rem 0; }
#cairn-soft .gear-control { min-width: min(100%, 290px); }
#cairn-soft .nav { display: flex; align-items: center; justify-content: space-between; gap: .25rem; flex-shrink: 0; margin-top: .5rem; padding: .5rem; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
#cairn-soft .nav button { flex: 1; }
#cairn-soft .nav .active { background: var(--green); color: var(--green-ink); border-radius: 999px; }
#cairn-soft .nav-item { display: inline-flex; gap: .35rem; align-items: center; }
@media (max-width: 680px) {
  #cairn-soft .hero { grid-template-columns: 1fr; }
  #cairn-soft .map { min-height: 210px; }
  #cairn-soft .signals { grid-template-columns: 1fr; }
  #cairn-soft .trail-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
  #cairn-soft .gear-row { align-items: stretch; flex-direction: column; }
  #cairn-soft .gear-control { min-width: 100%; }
  #cairn-soft .nav-text { display: none; }
}
</style>

/* ============================================================
   SESSION TYPE → ASSET KEY + CARD COLOR MAPPING
   ============================================================ */
const SESSION_ASSET = {
  'Easy Run': 'easy_run',
  'Recovery Run': 'recovery_run',
  'Long Run': 'long_run',
  'Long Trail Run': 'long_run',
  'Trail Run': 'trail_run',
  'Hill Session': 'hill_session',
  'Interval Session': 'interval_session',
  'Interval Run': 'interval_session',
  'Tempo Session': 'tempo_session',
  'Tempo Run': 'tempo_session',
  'Sprint Session': 'sprint_session',
  'Time Trial': 'time_trial',
  'Strength Training': 'strength_training',
  'Upper Body': 'strength_training',
  'Lower Body': 'strength_training',
  'Upper Body CAIRN': 'strength_training',
  'Lower Body + Arms CAIRN': 'strength_training',
  'Full Body Light CAIRN': 'strength_training',
  'Cross Training': 'cross_training',
  'Mobility': 'mobility',
  'Rest Day': 'rest_day',
  'Ruhetag': 'rest_day',
  'Race Day': 'race_day',
};

const STRUCTURED_TYPES = new Set([
  'Hill Session','Interval Session','Interval Run','Tempo Session','Tempo Run','Sprint Session','Time Trial'
]);

function getAssetKey(sessionType) {
  return SESSION_ASSET[sessionType] || 'cairn';
}

function assetUrl(sessionType) {
  return `/static/assets/cairn/svg/${getAssetKey(sessionType)}.svg`;
}

function weekCardColor(session) {
  if (session.is_past) return 'is-past';
  if (session.is_today) return 'is-coral';
  const t = session.session_type || '';
  if (/long trail|long run/i.test(t)) return 'is-dark';
  if (/upper body|lower body|strength|ruhetag|rest|mobility|core/i.test(t)) return 'is-sand';
  if (/interval|hill|tempo|sprint|time trial/i.test(t)) return 'is-coral';
  return 'is-soft';
}

function activityCardColor(activity) {
  const t = (activity.session_type || activity.type || '').toLowerCase();
  if (/long trail|long run|trail run/i.test(t)) return 'is-forest';
  if (/upper body|lower body|strength|weight/i.test(t)) return 'is-sand';
  if (/interval|hill|tempo|sprint|race/i.test(t)) return 'is-coral';
  return 'is-soft';
}

/* ============================================================
   APP STATE
   ============================================================ */
const state = {
  view: 'week',
  actYear: new Date().getFullYear(),
  actMonth: new Date().getMonth() + 1,
  activityId: null,
  weekLoaded: false,
  planLoaded: false,
};

/* ============================================================
   NAVIGATION
   ============================================================ */
const VIEW_IDS = {
  week: 'cairn-week-soft',
  plan: 'cairn-plan-soft',
  sync: 'cairn-sync-soft',
  activities: 'cairn-activities-soft',
  analysis: 'cairn-soft',
};

function navigate(view, id) {
  if (id !== undefined) state.activityId = id;
  state.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(VIEW_IDS[view]);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);

  switch (view) {
    case 'week':       if (!state.weekLoaded) loadWeek(); break;
    case 'plan':       if (!state.planLoaded) loadPlan(); break;
    case 'sync':       loadSync(); break;
    case 'activities': loadActivities(); break;
    case 'analysis':   if (state.activityId) loadAnalysis(state.activityId); break;
  }

  if (window.lucide) lucide.createIcons();
}

/* ============================================================
   HELPERS
   ============================================================ */
function e(tag, cls, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html) el.innerHTML = html;
  return el;
}

function fmt(val, unit) {
  if (val == null || val === 0) return null;
  return val + (unit ? ' ' + unit : '');
}

function fmtKm(km) {
  if (!km) return null;
  return Number(km).toLocaleString('de-CH', { minimumFractionDigits: 0, maximumFractionDigits: 1 }) + ' km';
}

function fmtMin(min) {
  if (!min) return null;
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')} h` : `${m} min`;
}

function fmtDuration(seconds) {
  if (!seconds) return null;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')} h`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function monthName(year, month) {
  return new Date(year, month - 1, 1).toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });
}

function apiGet(path) {
  return fetch(path).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

/* ============================================================
   WEEK VIEW
   ============================================================ */
async function loadWeek() {
  // Logo einblenden
  const brandEl = document.getElementById('week-brand');
  if (brandEl && !brandEl.innerHTML.trim()) brandEl.innerHTML = BRAND_SVG;

  try {
    const data = await apiGet('/api/frontend/week/all');
    renderWeek(data);
    state.weekLoaded = true;
  } catch (err) {
    document.getElementById('week-body').innerHTML =
      `<p class="loading-msg">Trainingsplan konnte nicht geladen werden. (${err.message})</p>`;
  }
}

function renderWeek(weeks) {
  if (!weeks || weeks.length === 0) {
    document.getElementById('week-body').innerHTML = '<p class="loading-msg">Kein Plan gefunden.</p>';
    return;
  }

  const currentWeek = weeks.find(w => w.is_current) || weeks[0];
  document.getElementById('wk-kw').textContent = `KW ${currentWeek.kw}`;
  document.getElementById('wk-range').textContent =
    `${currentWeek.monday}–${currentWeek.sunday}${currentWeek.is_current ? ' · diese Woche' : ''}`;

  const container = document.getElementById('week-body');
  container.innerHTML = '';

  // Render current week first (no divider), then remaining
  const sorted = [
    ...weeks.filter(w => w.is_current),
    ...weeks.filter(w => !w.is_current && !w.is_past),
    ...weeks.filter(w => !w.is_current && w.is_past),
  ];

  sorted.forEach((week, idx) => {
    if (idx > 0) {
      const div = document.createElement('div');
      div.className = 'week-divider';
      div.setAttribute('aria-labelledby', `kw-${week.kw}`);
      div.innerHTML = `<h2 id="kw-${week.kw}">KW ${week.kw}</h2><p>${week.monday}–${week.sunday}</p>`;
      container.appendChild(div);
    }

    const section = document.createElement('section');
    section.className = 'week-list';
    section.setAttribute('aria-label', `Trainingstage der KW ${week.kw}`);

    (week.sessions || []).forEach(sess => {
      section.appendChild(buildWeekCard(sess));
    });

    container.appendChild(section);
  });

  if (window.lucide) lucide.createIcons();
}

function buildWeekCard(sess) {
  const color = weekCardColor(sess);
  const hasStructure = STRUCTURED_TYPES.has(sess.session_type);
  const classes = ['card', 'week-card', color, hasStructure ? 'has-structure' : ''].filter(Boolean).join(' ');

  const article = document.createElement('article');
  article.className = classes;
  article.setAttribute('aria-labelledby', `day-${sess.date}`);

  // Day column
  const day = document.createElement('div');
  day.className = 'day';
  day.innerHTML = `<span class="day-number">${sess.day_number}</span><span class="day-name"><strong>${sess.day_short}</strong><span class="text-small">${sess.month_short}</span></span>`;
  article.appendChild(day);

  // Session column
  const sessionDiv = document.createElement('div');
  sessionDiv.className = 'session';

  let sessionHTML = '';
  if (sess.is_today) sessionHTML += `<span class="today text-small">HEUTE</span>`;
  sessionHTML += `<h2 id="day-${sess.date}">${sess.session_type || 'Session'}</h2>`;

  // Meta row
  const metaParts = [];
  if (sess.planned_km) metaParts.push(fmtKm(sess.planned_km));
  if (sess.planned_duration_min) metaParts.push(fmtMin(sess.planned_duration_min));
  if (sess.session_zone) metaParts.push(sess.session_zone);
  const statusLabel = sess.sync_status === 'synced' ? 'auf Garmin' :
    sess.status === 'completed' ? 'abgeschlossen' : 'geplant';
  metaParts.push(statusLabel);

  if (metaParts.length) {
    sessionHTML += `<div class="session-meta text-small">${metaParts.map(p => `<span>${p}</span>`).join('')}</div>`;
  }

  // Workout profile for structured sessions
  if (hasStructure && sess.steps && sess.steps.length) {
    sessionHTML += buildWorkoutProfile(sess.steps, sess.session_type);
  }

  sessionDiv.innerHTML = sessionHTML;
  article.appendChild(sessionDiv);

  // Art column (session image)
  const art = document.createElement('div');
  art.className = 'art';
  art.innerHTML = `<img src="${assetUrl(sess.session_type)}" alt="${sess.session_type}" loading="lazy">`;
  article.appendChild(art);

  return article;
}

/* Expand Garmin repeat groups into flat step list */
function flattenSteps(steps) {
  const flat = [];
  for (const step of (steps || [])) {
    const t = (step.type || step.step_type || '').toLowerCase();
    if (t === 'repeat' || t === 'repeatgroup' || t === 'repeat_group') {
      const count = step.repeat_count || step.iterations || step.numberOfIterations || 1;
      const sub = step.steps || step.workoutSteps || step.sub_steps || [];
      for (let i = 0; i < count; i++) flat.push(...flattenSteps(sub));
    } else {
      flat.push(step);
    }
  }
  return flat;
}

function buildWorkoutProfile(steps, sessionType) {
  const flat = flattenSteps(steps);
  if (!flat.length) return '';
  let html = '<div class="workout-profile" role="img" aria-label="Workout-Struktur">';
  const isHill = /hill/i.test(sessionType);
  const type = isHill ? 'hill' : 'interval';
  flat.forEach(step => {
    const stepType = (step.type || step.step_type || step.stepType || '').toLowerCase();
    if (stepType === 'warmup') {
      html += '<span class="phase warmup"><span class="sr-only">Warm-up</span></span>';
    } else if (stepType === 'cooldown') {
      html += '<span class="phase cooldown"><span class="sr-only">Cooldown</span></span>';
    } else if (stepType === 'active' || stepType === 'interval' || stepType === 'run') {
      html += `<span class="phase active ${type}"><span class="sr-only">Aktiv</span></span>`;
    } else if (stepType === 'recovery' || stepType === 'rest' || stepType === 'walk') {
      html += `<span class="phase recovery ${type}"><span class="sr-only">Recovery</span></span>`;
    }
    // Ignore unknown step types (don't render garbage blocks)
  });
  html += '</div>';
  return html;
}

function buildProgressCard(plan, currentWeek, totalWeeks, phase, weeklyLoad) {
  const phases = ['BASE', 'BUILD', 'PEAK', 'TAPER', 'RACE'];
  const phaseTabs = phases.map(p =>
    `<span${p === phase ? ' class="active"' : ''}>${p}</span>`
  ).join('');

  // Load chart - build 16 bars from weeklyLoad or pad to 16
  const bars = [];
  const maxKm = Math.max(...weeklyLoad.map(w => w.km || 0), 1);
  for (let i = 1; i <= totalWeeks; i++) {
    const weekData = weeklyLoad.find(w => (w.week_number || w.week) === i) || {};
    const km = weekData.km || weekData.planned_km || 0;
    const pct = Math.round((km / maxKm) * 96) + 4;
    const isDone = i < currentWeek;
    const isCurrent = i === currentWeek;
    const isDeload = weekData.is_deload;
    const classes = ['load-week', isDone ? 'done' : '', isCurrent ? 'current' : '', isDeload ? 'deload' : ''].filter(Boolean).join(' ');
    const valueTag = (isCurrent || (i === totalWeeks)) && km ? `<span class="load-value text-small">${Math.round(km)}</span>` : '';
    bars.push(`<span class="${classes}"><span class="load-bar" style="--h:${pct}%">${valueTag}</span><span class="load-label text-small">${i}</span></span>`);
  }

  // Week track dots
  const dots = [];
  for (let i = 1; i <= totalWeeks; i++) {
    const isDone = i < currentWeek;
    const isCurrent = i === currentWeek;
    const cls = isDone ? 'week-node done' : isCurrent ? 'week-node current' : 'week-node';
    dots.push(`<span class="${cls}"><span class="sr-only">Woche ${i}${isDone?' abgeschlossen':isCurrent?' aktuell':''}</span></span>`);
  }

  const done = currentWeek - 1;
  const remaining = totalWeeks - currentWeek;

  return `
    <div class="section-head">
      <div><p class="eyebrow text-small">AKTUELLE PHASE</p><h2 id="phase-title">${phase}</h2></div>
      <div class="focus"><span class="text-small">FOKUS</span><strong>${plan.phase_focus || '—'}</strong></div>
    </div>
    <div class="phase-tabs text-small" aria-label="Trainingsphasen">${phaseTabs}</div>
    <div class="load-block">
      <div class="load-head"><div><p class="eyebrow text-small">BELASTUNGSVERTEILUNG</p><h3>Wochenkilometer</h3></div><p class="text-small">DELOAD · W4 / W8 / W12</p></div>
      <div class="load-chart" role="img" aria-label="Geplante Wochenkilometer">${bars.join('')}</div>
    </div>
    <div class="week-track" role="img" aria-label="Woche ${currentWeek} von ${totalWeeks}">${dots.join('')}</div>
    <div class="track-labels text-small"><span>1</span><span>${Math.round(totalWeeks/4)}</span><span class="current-label">${currentWeek} · DU BIST HIER</span><span>${Math.round(totalWeeks*0.75)}</span><span>${totalWeeks}</span></div>
    <div class="progress-foot text-small"><span>${done} WOCHE${done !== 1 ? 'N' : ''} ERLEDIGT</span><span>${remaining} WOCHE${remaining !== 1 ? 'N' : ''} + RACE</span></div>
  `;
}

function buildMilestonesCard(milestones, race) {
  const items = milestones.map((ms, i) => {
    const isDone = ms.status === 'done' || ms.completed;
    const isNext = !isDone && milestones.slice(0, i).every(m => m.status === 'done' || m.completed) && i < milestones.length;
    const cls = isDone ? 'milestone done' : isNext ? 'milestone next' : 'milestone';
    const icon = isDone ? `<i data-lucide="check" aria-hidden="true"></i>` : isNext ? `<i data-lucide="arrow-right" aria-hidden="true"></i>` : '';
    const status = isDone ? 'GESCHAFFT' : isNext ? 'ALS NÄCHSTES' : 'OFFEN';
    const step = String(i + 1).padStart(2, '0');
    return `<article class="${cls}">
      <span class="milestone-node">${icon}</span>
      <div class="milestone-copy">
        <p class="text-small">STEP ${step}</p>
        <h3>${ms.title || ms.name}</h3>
        <p>${ms.description || ms.details || ''}</p>
      </div>
      <span class="milestone-status text-small">${status}</span>
    </article>`;
  }).join('');

  const raceDate = race.date || '';
  return `
    <h2 id="milestones-title">Milestones</h2>
    <div class="milestone-list">${items}</div>
    ${raceDate ? `<p class="race-finish"><strong>RACE DAY</strong> · ${raceDate.toUpperCase()}</p>` : ''}
  `;
}

function renderSync(data) {
  // /api/frontend/sync returns:
  // connections: {mcp: {connected, last_check, ...}, garmin: {...}, database: {...}}
  // activities: [{date, date_label, session_type, title, km, duration_min}]
  // changes: [{when, workout_name, description, status, status_label, has_error, error_hint}]
  const connObj = data.connections || {};
  const connections = Object.entries(connObj).map(([key, c]) => ({
    name: { mcp: 'MCP Server', garmin: 'Garmin Connect', database: 'Datenbank' }[key] || key,
    connected: c.connected !== false,
    detail: c.last_check || c.status || '',
  }));
  const activities = data.activities || [];
  const changes = data.changes || [];

  const container = document.getElementById('sync-body');
  container.innerHTML = '';

  // Connections card
  const connRows = connections.map(c => `
    <div class="connection-row">
      <strong>${c.name}</strong>
      <span class="connection-status">
        <span class="status-dot" style="${c.connected ? '' : 'background:var(--coral)'}" aria-hidden="true"></span>
        <span>${c.connected ? 'Verbunden' : 'Getrennt'}</span>
      </span>

  `).join('');

  const connCard = e('section', 'card connections', `
    <p class="section-title text-small">VERBINDUNGEN</p>
    <div class="connection-list">${connRows}</div>
  `);
  container.appendChild(connCard);

  // Recent activities card
  // Fields: {date, date_label, session_type, title, km, duration_min}
  const actRows = activities.map(act => {
    const label = act.date_label || (act.date ? new Date(act.date).toLocaleDateString('de-CH', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase() : '');
    const metaParts = [fmtKm(act.km || act.distance_km), fmtMin(act.duration_min)].filter(Boolean);
    return `<div class="activity-row">
      <span class="activity-date text-small">${label}</span>
      <div class="activity-copy">
        <h2>${act.title || act.session_type || '—'}</h2>
        <p class="text-small">${metaParts.join(' · ')}</p>
      </div>
      <div class="activity-art">
        <img src="${assetUrl(act.session_type)}" alt="${act.session_type || ''}" loading="lazy">
      </div>
    </div>`;
  }).join('') || '<p class="text-small" style="padding:.5rem 0;opacity:.7">Keine aktuellen Aktivitäten</p>';

  const actCard = e('section', 'card activities', `
    <p class="section-title text-small">LETZTE UPLOADS</p>
    <div class="activity-list">${actRows}</div>
  `);
  container.appendChild(actCard);

  // Changes card
  // Fields: {when, workout_name, description, status, status_label, has_error, error_hint}
  const changeRows = changes.map(ch => {
    const icon = ch.has_error ? 'alert-circle' : 'git-commit-horizontal';
    const statusText = ch.status_label || ch.status || 'OK';
    const errHint = ch.has_error && ch.error_hint ? `<p class="change-error text-small">${ch.error_hint}</p>` : '';
    return `<div class="change-row">
      <span class="change-node" aria-hidden="true"><i data-lucide="${icon}"></i></span>
      <span class="change-time text-small">${ch.when || ''}</span>
      <div class="change-copy">
        <h2>${ch.workout_name || '—'}</h2>
        <p>${ch.description || ''}</p>
        <p class="change-status text-small">${statusText}</p>
        ${errHint}
      </div>
    </div>`;
  }).join('') || '<p class="text-small" style="padding:.5rem 0;opacity:.7">Keine aktuellen Änderungen</p>';

  const allOk = connections.every(c => c.connected);
  const changesCard = e('section', 'card changes', `
    <p class="section-title text-small">LETZTE ÄNDERUNGEN</p>
    <div class="change-list">${changeRows}</div>
    ${allOk ? '<div class="sync-ok text-small"><i data-lucide="check-circle" aria-hidden="true"></i><span>Alles synchronisiert</span></div>' : ''}
  `);
  container.appendChild(changesCard);

  if (window.lucide) lucide.createIcons();
}

function renderActivities(data) {
  // /api/activities/month returns {actual: {"YYYY-MM-DD": [{type, name, duration_min, distance_km, avg_hr, training_id, is_done}]}, plan: {...}}
  let activities = [];
  if (data.actual && typeof data.actual === 'object') {
    // flatten date-keyed dict into flat array, sorted descending by date
    activities = Object.entries(data.actual)
      .sort(([a], [b]) => b.localeCompare(a))
      .flatMap(([dateStr, entries]) =>
        (entries || []).map(entry => ({
          date: dateStr,
          session_type: entry.type || entry.session_type,
          name: entry.name,
          duration_min: entry.duration_min,
          distance_km: entry.distance_km,
          avg_hr: entry.avg_hr,
          training_id: entry.training_id,
          is_done: entry.is_done,
          analysis_available: entry.has_analysis || false,
        }))
      );
  } else {
    activities = data.activities || data || [];
  }
  const count = activities.length;
  document.getElementById('acts-count').textContent =
    `${count} AKTIVITÄT${count !== 1 ? 'EN' : ''}`;

  const container = document.getElementById('acts-body');
  if (!count) {
    container.innerHTML = '<p class="loading-msg" style="padding:2rem 0;text-align:center">Keine Aktivitäten in diesem Monat.</p>';
    return;
  }

  container.innerHTML = activities.map(act => {
    const color = activityCardColor(act);
    const d = act.date ? new Date(act.date) : null;
    const dayNum = d ? d.getDate() : '—';
    const dayName = d ? d.toLocaleDateString('de-CH', { weekday: 'short' }).toUpperCase() : '';
    const monthShort = d ? d.toLocaleDateString('de-CH', { month: 'short' }).toUpperCase() : '';

    const metaParts = [];
    if (act.distance_km) metaParts.push(fmtKm(act.distance_km));
    if (act.duration_sec) metaParts.push(fmtDuration(act.duration_sec));
    if (act.elevation_m) metaParts.push(`${act.elevation_m} HM`);
    if (act.avg_hr) metaParts.push(`Ø ${act.avg_hr} bpm`);
    if (act.duration_min && !act.duration_sec) metaParts.push(fmtMin(act.duration_min));

    const metaLabel = act.analysis_available ? 'ANALYSIERT' :
      act.analysis_pending ? 'ANALYSE OFFEN' : 'ABGESCHLOSSEN';
    const metaSub = act.shoe ? `${act.shoe.toUpperCase()} · ${metaLabel}` : metaLabel;

    const actId = act.training_id || act.id;
    return `<article class="card activity-card ${color}" aria-labelledby="act-${actId}">
      <div class="date-box">
        <span class="date-number">${dayNum}</span>
        <span class="date-copy"><strong>${dayName}</strong><span class="text-small">${monthShort}</span></span>
      </div>
      <div class="activity-copy">
        <h3 id="act-${actId}">${act.name || act.session_type}</h3>
        <div class="metric-row">${metaParts.map(p => `<span>${p}</span>`).join('')}</div>
        <p class="activity-meta text-small">${metaSub}</p>
      </div>
      <div class="card-side">
        <button class="btn btn-ghost" type="button" onclick="navigate('analysis', ${actId})" aria-label="Analyse öffnen">
          <i data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </article>`;
  }).join('');

  if (window.lucide) lucide.createIcons();
}

    <div class="gear-row">
      <div>
        <p class="eyebrow text-small">GEAR</p>
        <h3 id="soft-gear">Schuh zuordnen</h3>
        <p>${fmtKm(act.distance_km) || '—'} werden einmalig verbucht.</p>
      </div>
      <div class="gear-control">
        <label class="form-label" for="soft-shoe">Laufschuh</label>
        <select class="form-select" id="soft-shoe">
          <option>${act.shoe || 'Noch nicht zugeordnet'}</option>
        </select>
      </div>
    </div>
  </section>`;

  container.innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

/* — Chart helpers — */
function buildElevationChart(points, elevUp) {
  if (!points || !points.length) return '';
  const W = 760, H = 270, padX = 48, padY = 45, bottom = 218;
  const maxE = Math.max(...points.map(p => p[1] || p.y || 0));
  const minE = Math.min(...points.map(p => p[1] || p.y || 0));
  const range = maxE - minE || 1;
  const n = points.length;
  const pts = points.map((p, i) => {
    const x = padX + (i / (n - 1)) * (W - padX - 16);
    const y = bottom - ((( (p[1] || p.y || 0) - minE) / range) * (bottom - padY));
    return [x, y];
  });
  const polyline = pts.map(p => p.join(' ')).join('L');
  const fill = `M${pts[0][0]} ${pts[0][1]}L${polyline}L${pts[pts.length-1][0]} ${bottom}L${pts[0][0]} ${bottom}Z`;
  const line = `M${polyline}`;
  const lastX = pts[pts.length-1][0];
  const distLabel = points[points.length-1][0] ? Math.round(points[points.length-1][0]) : '';
  return `<section class="card panel soft-card" aria-labelledby="soft-elev">
    <div class="head"><div><p class="eyebrow text-small">TRAILPROFIL</p><h2 id="soft-elev">Höhenmeter</h2></div><span class="pill text-small">${elevUp ? elevUp + ' HM+' : '—'}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Höhenprofil">
      <line class="grid" x1="${padX}" y1="${padY}" x2="${W-16}" y2="${padY}"/>
      <line class="grid" x1="${padX}" y1="${(bottom+padY)/2}" x2="${W-16}" y2="${(bottom+padY)/2}"/>
      <line class="grid" x1="${padX}" y1="${bottom}" x2="${W-16}" y2="${bottom}"/>
      <path class="elev-fill" d="${fill}"/>
      <path class="elev-line" d="${line}"/>
      <text class="axis" x="4" y="${padY+4}">${Math.round(maxE)} m</text>
      <text class="axis" x="4" y="${(bottom+padY)/2+4}">${Math.round((maxE+minE)/2)} m</text>
      <text class="axis" x="4" y="${bottom+4}">${Math.round(minE)} m</text>
      <text class="axis" x="${padX}" y="${H-22}">0</text>
      <text class="axis" x="${lastX-12}" y="${H-22}">${distLabel} KM</text>
    </svg>
    <div class="trail-stats">
      <div class="trail-stat"><span class="text-small">MAX. HÖHE</span><strong>${Math.round(maxE)} m</strong></div>
      <div class="trail-stat"><span class="text-small">MIN. HÖHE</span><strong>${Math.round(minE)} m</strong></div>
    </div>
  </section>`;
}

function buildPaceChart(splits, avgPace) {
  if (!splits || !splits.length) return '';
  const W = 760, H = 230, padX = 45, padY = 45, bottom = 175;
  const paces = splits.map(s => s.pace_sec || s[1] || 0).filter(Boolean);
  const maxP = Math.max(...paces);
  const minP = Math.min(...paces);
  const range = maxP - minP || 1;
  const n = splits.length;
  const barW = Math.max(18, Math.floor((W - padX - 16) / n) - 4);
  const bars = splits.map((s, i) => {
    const pace = s.pace_sec || s[1] || 0;
    const km = s.km || s.distance_km || (i + 1);
    const h = bottom - padY > 0 ? ((pace - minP) / range) * (bottom - padY - 10) + 10 : 20;
    const x = padX + i * ((W - padX - 16) / n) + 2;
    const isHot = pace > (maxP * 0.9);
    const hotCls = isHot ? ' hot' : '';
    return `<rect class="pace-bar${hotCls}" x="${Math.round(x)}" y="${Math.round(bottom - h)}" width="${barW}" height="${Math.round(h)}" rx="5"/>`;
  }).join('');

  return `<section class="card panel sand-card" aria-labelledby="soft-pace">
    <div class="head"><div><p class="eyebrow text-small">GESCHWINDIGKEIT</p><h2 id="soft-pace">Pace pro Kilometer</h2></div><span class="pill text-small">Ø ${avgPace || '—'}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace-Balken">
      <line class="grid" x1="${padX}" y1="${padY}" x2="${W-16}" y2="${padY}"/>
      <line class="grid" x1="${padX}" y1="${(bottom+padY)/2}" x2="${W-16}" y2="${(bottom+padY)/2}"/>
      <line class="grid" x1="${padX}" y1="${bottom}" x2="${W-16}" y2="${bottom}"/>
      ${bars}
      <text class="axis" x="5" y="${padY+4}">schnell</text>
      <text class="axis" x="5" y="${bottom+4}">langsam</text>
      <text class="axis" x="${padX}" y="${H-14}">1</text>
      <text class="axis" x="${W-30}" y="${H-14}">${n} KM</text>
    </svg>
  </section>`;
}

function buildHRChart(points, avgHr) {
  if (!points || !points.length) return '';
  const W = 760, H = 220, padX = 48, padY = 35, bottom = 155;
  const hrs = points.map(p => p[1] || p.hr || p.y || 0);
  const maxH = Math.max(...hrs, 1);
  const minH = Math.min(...hrs);
  const range = maxH - minH || 1;
  const n = points.length;
  const pts = points.map((p, i) => {
    const x = padX + (i / (n - 1)) * (W - padX - 16);
    const y = bottom - (((p[1] || p.hr || p.y || 0) - minH) / range) * (bottom - padY);
    return [Math.round(x), Math.round(y)];
  });
  const polyline = pts.map(p => p.join(' ')).join('L');
  const fill = `M${pts[0][0]} ${pts[0][1]}L${polyline}L${pts[pts.length-1][0]} ${bottom}L${pts[0][0]} ${bottom}Z`;
  const avgY = avgHr ? bottom - (((avgHr - minH) / range) * (bottom - padY)) : null;

  return `<section class="card panel soft-card" aria-labelledby="soft-hr">
    <div class="head"><div><p class="eyebrow text-small">BELASTUNG</p><h2 id="soft-hr">Herzfrequenz</h2></div><span class="pill text-small">Ø ${avgHr || '—'} BPM</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Herzfrequenzkurve">
      <line class="grid" x1="${padX}" y1="${padY}" x2="${W-16}" y2="${padY}"/>
      <line class="grid" x1="${padX}" y1="${(bottom+padY)/2}" x2="${W-16}" y2="${(bottom+padY)/2}"/>
      <line class="grid" x1="${padX}" y1="${bottom}" x2="${W-16}" y2="${bottom}"/>
      <path class="hr-fill" d="${fill}"/>
      <path class="hr-line" d="M${polyline}"/>
      ${avgY ? `<line class="avg" x1="${padX}" y1="${Math.round(avgY)}" x2="${W-16}" y2="${Math.round(avgY)}"/>` : ''}
      <text class="axis" x="7" y="${padY+4}">${Math.round(maxH)}</text>
      <text class="axis" x="7" y="${bottom+4}">${Math.round(minH)}</text>
    </svg>
  </section>`;
}

function buildHRZones(zones, lthr) {
  if (!zones || !zones.length) return '';
  const maxTime = Math.max(...zones.map(z => z.seconds || 0), 1);
  const rows = zones.map((z, i) => {
    const pct = Math.round(((z.seconds || 0) / maxTime) * 96) + 2;
    const mins = Math.floor((z.seconds || 0) / 60);
    const secs = (z.seconds || 0) % 60;
    const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    return `<div class="zone-row"><strong>Z${i+1}</strong><div class="zone-track"><div class="zone-fill" style="--w:${pct}%"></div></div><span>${timeStr}</span></div>`;
  }).join('');

  return `<section class="card panel coral-card" aria-labelledby="soft-zones">
    <div class="head"><div><p class="eyebrow text-small">ZEIT IN ZONE</p><h2 id="soft-zones">Herzfrequenzzonen</h2></div><span class="pill text-small">${lthr ? 'LTHR ' + lthr : 'HF-ZONEN'}</span></div>
    ${rows}
  </section>`;
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  // Inject brand marks into views that need them
  const syncBrand = document.getElementById('sync-brand');
  if (syncBrand) syncBrand.innerHTML = BRAND_SVG;
  const actsBrand = document.getElementById('acts-brand');
  if (actsBrand) actsBrand.innerHTML = BRAND_SVG;
  const analysisBrand = document.getElementById('analysis-brand');
  if (analysisBrand) analysisBrand.innerHTML = BRAND_SVG + '<button class="btn circle" type="button" aria-label="Einstellungen" style="margin-left:auto">+</button>';

  // Load initial view
  loadWeek();

  // Init lucide icons
  if (window.lucide) lucide.createIcons();
}

// Wait for lucide to load, then init
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
